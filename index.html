<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Music Player</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .bg-slideshow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .bg-slide {
            position: absolute;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        .bg-slide.active {
            opacity: 1;
        }

        .player-container {
            width: 90%;
            max-width: 480px;
            position: relative;
            z-index: 10;
            margin-top: 15vh;
        }

        .playlist-window, .glass-bar {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 12px 35px 0 rgba(0, 0, 0, 0.35);
            border-radius: 24px;
        }

        .playlist-window {
            position: absolute;
            bottom: calc(100% + 15px);
            left: 0;
            width: 100%;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
            transition: max-height 0.4s ease, opacity 0.3s ease, padding 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .playlist-window.open {
            max-height: 380px;
            opacity: 1;
            pointer-events: auto;
            padding: 20px;
        }

        .playlist-header {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .folder-actions {
            display: flex;
            gap: 10px;
        }

        .upload-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.25);
            border: none;
            color: #fff;
            padding: 8px 10px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            transition: background 0.2s;
        }

        .upload-btn:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .tabs {
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.15);
            padding: 4px;
            border-radius: 12px;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            padding: 6px 0;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: rgba(255, 255, 255, 0.3);
            color: #fff;
        }

        .song-list {
            list-style: none;
            overflow-y: auto;
            max-height: 200px;
        }

        .song-item {
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .song-item:hover, .song-item.active {
            background: rgba(255, 255, 255, 0.3);
        }

        .glass-bar {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .track-info-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
        }

        .track-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }

        .album-art {
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .track-details {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .track-title {
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 0.75rem;
            opacity: 0.8;
        }

        .chevron-icon {
            transition: transform 0.3s;
            flex-shrink: 0;
        }

        .chevron-icon.rotated {
            transform: rotate(180deg);
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            font-size: 0.75rem;
            opacity: 0.9;
        }

        input[type="range"] {
            accent-color: #ffffff;
            cursor: pointer;
            height: 4px;
            width: 100%;
            border-radius: 2px;
        }

        .buttons-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.85);
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            color: #fff;
            transform: scale(1.1);
        }

        .icon-btn.active-mode {
            color: #4ade80;
        }

        .play-pause-btn {
            background: #fff;
            color: #000;
            width: 48px;
            height: 48px;
            border-radius: 50%;
        }

        .play-pause-btn:hover {
            color: #000;
            transform: scale(1.08);
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding-top: 4px;
        }
    </style>
</head>
<body>
    <div class="bg-slideshow">
        <div class="bg-slide active" style="background-image: url('SaveInta.com_786060323_18628526431035421_5031118763642636539_n.jpg');"></div>
    </div>

    <input type="file" id="main-folder-input" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg" multiple style="display: none;">
    <input type="file" id="reel-folder-input" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg" multiple style="display: none;">

    <div class="player-container">
        <div class="playlist-window" id="playlist-window">
            <div class="playlist-header">
                <div class="folder-actions">
                    <button class="upload-btn" id="upload-main-btn">
                        <i data-lucide="folder-plus"></i> Add All Songs
                    </button>
                    <button class="upload-btn" id="upload-reel-btn">
                        <i data-lucide="film"></i> Add Reel Songs
                    </button>
                </div>
                <div class="tabs">
                    <button class="tab-btn active" id="tab-main">All Songs (0)</button>
                    <button class="tab-btn" id="tab-reel">Reels (0)</button>
                </div>
            </div>
            <ul class="song-list" id="song-list"></ul>
        </div>

        <div class="glass-bar">
            <div class="track-info-container" id="track-trigger">
                <div class="track-meta">
                    <div class="album-art">
                        <i data-lucide="music"></i>
                    </div>
                    <div class="track-details">
                        <span class="track-title" id="track-title">Loading tracks...</span>
                        <span class="track-artist" id="track-artist">Please wait</span>
                    </div>
                </div>
                <i data-lucide="chevron-up" class="chevron-icon" id="chevron-icon"></i>
            </div>

            <div class="progress-container">
                <span id="current-time">0:00</span>
                <input type="range" id="seek-bar" value="0" min="0" max="100">
                <span id="duration">0:00</span>
            </div>

            <div class="buttons-row">
                <button id="shuffle-btn" class="icon-btn" title="Shuffle Mode"><i data-lucide="shuffle"></i></button>
                <button id="prev-btn" class="icon-btn" title="Previous Track"><i data-lucide="skip-back"></i></button>
                <button id="play-btn" class="icon-btn play-pause-btn" title="Play / Pause"><i data-lucide="play"></i></button>
                <button id="next-btn" class="icon-btn" title="Next Track"><i data-lucide="skip-forward"></i></button>
                <button id="repeat-btn" class="icon-btn" title="Repeat Mode"><i data-lucide="repeat"></i></button>
            </div>

            <div class="volume-container">
                <i data-lucide="volume-2" id="volume-icon"></i>
                <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="0.8">
            </div>
        </div>
    </div>

    <audio id="audio-player"></audio>

    <script>
        lucide.createIcons();

        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const repeatBtn = document.getElementById('repeat-btn');
        const seekBar = document.getElementById('seek-bar');
        const volumeBar = document.getElementById('volume-bar');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');
        const trackTitle = document.getElementById('track-title');
        const trackArtist = document.getElementById('track-artist');
        
        const mainFolderInput = document.getElementById('main-folder-input');
        const reelFolderInput = document.getElementById('reel-folder-input');
        const uploadMainBtn = document.getElementById('upload-main-btn');
        const uploadReelBtn = document.getElementById('upload-reel-btn');
        
        const tabMain = document.getElementById('tab-main');
        const tabReel = document.getElementById('tab-reel');
        const songListEl = document.getElementById('song-list');
        const playlistWindow = document.getElementById('playlist-window');
        const trackTrigger = document.getElementById('track-trigger');
        const chevronIcon = document.getElementById('chevron-icon');

        let mainPlaylist = [];
        let reelPlaylist = [];
        let activeTab = 'main';
        
        let currentIndex = 0;
        let isPlaying = false;
        let isShuffle = false;
        let isRepeat = false;

        function processUrl(rawPath) {
            if (!rawPath) return '';
            if (rawPath.startsWith('blob:') || rawPath.startsWith('http://') || rawPath.startsWith('https://')) {
                return rawPath;
            }
            return encodeURI(rawPath);
        }

        async function fetchCatalog() {
            try {
                const response = await fetch('songs.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                const data = await response.json();

                if (Array.isArray(data)) {
                    mainPlaylist = data.map(song => ({
                        title: song.title,
                        artist: song.artist || 'Unknown Artist',
                        url: processUrl(song.file_path || song.url)
                    }));
                } else {
                    if (data.main) {
                        mainPlaylist = data.main.map(song => ({
                            title: song.title,
                            artist: song.artist || 'Unknown Artist',
                            url: processUrl(song.file_path || song.url)
                        }));
                    }
                    if (data.reels) {
                        reelPlaylist = data.reels.map(song => ({
                            title: song.title,
                            artist: song.artist || 'Unknown Artist',
                            url: processUrl(song.file_path || song.url)
                        }));
                    }
                }
            } catch (err) {
                console.warn('Could not load songs.json or failed to load. Manual upload available.', err);
            }
            
            updateTabLabels();
            updatePlaylistUI();

            const currentList = getActivePlaylist();
            if (currentList.length > 0) {
                loadSong(0);
            } else {
                trackTitle.innerText = "No song loaded";
                trackArtist.innerText = "Click to open playlist & upload";
            }
        }

       

        uploadMainBtn.addEventListener('click', () => mainFolderInput.click());
        uploadReelBtn.addEventListener('click', () => reelFolderInput.click());

        mainFolderInput.addEventListener('change', (e) => {
            handleFileUpload(e.target.files, mainPlaylist, 'All Songs');
            updateTabLabels();
            if (activeTab === 'main') updatePlaylistUI();
        });

        reelFolderInput.addEventListener('change', (e) => {
            handleFileUpload(e.target.files, reelPlaylist, 'Reels');
            updateTabLabels();
            if (activeTab === 'reel') updatePlaylistUI();
        });

        function handleFileUpload(files, targetArray, categoryLabel) {
            Array.from(files).forEach(file => {
                targetArray.push({
                    title: file.name.replace(/\.[^/.]+$/, ""),
                    artist: categoryLabel,
                    url: URL.createObjectURL(file)
                });
            });
            const activeList = getActivePlaylist();
            if (activeList.length > 0 && (trackTitle.innerText === "No song loaded" || !audio.src)) {
                loadSong(0);
            }
        }

        function updateTabLabels() {
            tabMain.innerText = `All Songs (${mainPlaylist.length})`;
            tabReel.innerText = `Reels (${reelPlaylist.length})`;
        }

        tabMain.addEventListener('click', () => {
            activeTab = 'main';
            tabMain.classList.add('active');
            tabReel.classList.remove('active');
            currentIndex = 0;
            updatePlaylistUI();
        });

        tabReel.addEventListener('click', () => {
            activeTab = 'reel';
            tabReel.classList.add('active');
            tabMain.classList.remove('active');
            currentIndex = 0;
            updatePlaylistUI();
        });

        function getActivePlaylist() {
            return activeTab === 'main' ? mainPlaylist : reelPlaylist;
        }

        function updatePlaylistUI() {
            songListEl.innerHTML = "";
            const currentList = getActivePlaylist();
            
            if (currentList.length === 0) {
                songListEl.innerHTML = `<li class="song-item" style="opacity: 0.6; justify-content: center;">No tracks available</li>`;
                return;
            }

            currentList.forEach((song, index) => {
                const li = document.createElement('li');
                li.className = `song-item ${index === currentIndex ? 'active' : ''}`;
                li.innerHTML = `<span>${song.title}</span>`;
                li.addEventListener('click', () => {
                    currentIndex = index;
                    loadSong(currentIndex);
                    playSong();
                });
                songListEl.appendChild(li);
            });
        }

        function setupMediaSession(song) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: song.title,
                    artist: song.artist,
                    album: 'Glassmorphism Player'
                });

                navigator.mediaSession.setActionHandler('play', () => playSong());
                navigator.mediaSession.setActionHandler('pause', () => pauseSong());
                navigator.mediaSession.setActionHandler('previoustrack', () => prevBtn.click());
                navigator.mediaSession.setActionHandler('nexttrack', () => nextBtn.click());
            }
        }

        function loadSong(index) {
            const currentList = getActivePlaylist();
            if (!currentList[index]) return;
            
            const song = currentList[index];
            audio.src = song.url;
            trackTitle.innerText = song.title;
            trackArtist.innerText = song.artist;
            setupMediaSession(song);
            updatePlaylistUI();
        }

        function playSong() {
            if (!audio.src) return;
            audio.play().then(() => {
                isPlaying = true;
                playBtn.innerHTML = `<i data-lucide="pause"></i>`;
                lucide.createIcons();
            }).catch(e => {
                console.warn('Playback error or interrupted:', e);
            });
        }

        function pauseSong() {
            isPlaying = false;
            audio.pause();
            playBtn.innerHTML = `<i data-lucide="play"></i>`;
            lucide.createIcons();
        }

        playBtn.addEventListener('click', () => {
            if (isPlaying) pauseSong();
            else playSong();
        });

        prevBtn.addEventListener('click', () => {
            const currentList = getActivePlaylist();
            if (currentList.length === 0) return;
            currentIndex = (currentIndex - 1 + currentList.length) % currentList.length;
            loadSong(currentIndex);
            playSong();
        });

        nextBtn.addEventListener('click', () => {
            const currentList = getActivePlaylist();
            if (currentList.length === 0) return;
            if (isShuffle) {
                currentIndex = Math.floor(Math.random() * currentList.length);
            } else {
                currentIndex = (currentIndex + 1) % currentList.length;
            }
            loadSong(currentIndex);
            playSong();
        });

        shuffleBtn.addEventListener('click', () => {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('active-mode', isShuffle);
        });

        repeatBtn.addEventListener('click', () => {
            isRepeat = !isRepeat;
            repeatBtn.classList.toggle('active-mode', isRepeat);
        });

        audio.addEventListener('error', (e) => {
            console.error("Audio failed to load:", audio.src, e);
            const currentList = getActivePlaylist();
            if (currentList.length > 1) {
                nextBtn.click();
            }
        });

        audio.addEventListener('ended', () => {
            if (isRepeat) {
                playSong();
            } else {
                nextBtn.click();
            }
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const progressPercent = (audio.currentTime / audio.duration) * 100;
                seekBar.value = progressPercent;
                currentTimeEl.innerText = formatTime(audio.currentTime);
                durationEl.innerText = formatTime(audio.duration);
            }
        });

        seekBar.addEventListener('input', () => {
            if (audio.duration) {
                audio.currentTime = (seekBar.value / 100) * audio.duration;
            }
        });

        volumeBar.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });

        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        document.addEventListener('DOMContentLoaded', fetchCatalog);
    </script>
</body>
</html>
